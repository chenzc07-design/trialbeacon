name: Weekly ClinicalTrials Frontier Sync

on:
  schedule:
    # Weekly, deliberately offset from the dependency audit and quality jobs.
    - cron: '23 4 * * 2'
  workflow_dispatch:
    inputs:
      skip_charts:
        description: 'Skip PNG chart generation and update JSON assets only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-ctgov-frontier
  cancel-in-progress: false

jobs:
  sync-and-publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET: trialbeacon-ci-build-placeholder
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.TRIALBEACON_APP_ID }}
          private-key: ${{ secrets.TRIALBEACON_APP_PRIVATE_KEY }}
          owner: chenzc07-design
          repositories: trialbeacon
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Verify GitHub App credentials
        env:
          GITHUB_APP_CLIENT_ID: ${{ secrets.TRIALBEACON_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.TRIALBEACON_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/verify_github_app_secrets.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install chart dependency
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_charts != true }}
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Sync ClinicalTrials.gov snapshot
        run: python3 scripts/sync_ctgov_snapshot.py --output-dir data/snapshots --page-size 100 --max-pages 1

      - name: Rebuild frontend frontier assets
        env:
          SKIP_CHARTS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.skip_charts == true) }}
        run: |
          if [ "$SKIP_CHARTS" = "true" ]; then
            python3 scripts/update_frontier_assets.py --skip-charts
          else
            python3 scripts/update_frontier_assets.py
          fi

      - name: Check generated diff
        id: diff
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only --diff-filter=ACMRTUXB | grep -Ev '^(lib/data/frontier-trials\.json|lib/data/frontier-phase-matrix\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes detected:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if git diff --quiet -- lib/data/frontier-trials.json lib/data/frontier-phase-matrix.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No frontend index changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- lib/data/frontier-trials.json lib/data/frontier-phase-matrix.json
          fi

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctgov-frontier-sync-${{ github.run_id }}
          path: |
            data/snapshots/ctgov-latest.report.json
            data/analysis/frontier-trials-*/summary.json
            data/analysis/frontier-trials-*/report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit updated frontend assets
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "trialbeacon-sync[bot]"
          git config user.email "trialbeacon-sync[bot]@users.noreply.github.com"
          git add -- lib/data/frontier-trials.json lib/data/frontier-phase-matrix.json
          git diff --cached --check
          git commit -m "chore(data): refresh frontier trial index"
          gh auth setup-git
          git push origin HEAD:master
